previews:
  generation: off

projects:
  - name: loyal-observability
    environments:
      - name: test
        services:
          - type: web
            name: loyal-clickstack
            runtime: docker
            repo: https://github.com/loyal-labs/loyal-app.git
            branch: main
            region: oregon
            plan: pro
            numInstances: 1
            rootDir: observability
            dockerfilePath: ./Dockerfile
            dockerContext: .
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - observability/**
              ignoredPaths:
                - observability/smoke-result.json
            healthCheckPath: /api/health
            renderSubdomainPolicy: enabled
            envVars:
              - key: PORT
                value: "8080"
              - key: HYPERDX_APP_PORT
                value: "8080"
              - key: HYPERDX_APP_LISTEN_HOSTNAME
                value: 0.0.0.0
              - key: USAGE_STATS_ENABLED
                value: "false"
              - key: CLICKSTACK_INTERNAL_SMOKE_ENABLED
                value: "true"
              - key: EXPRESS_SESSION_SECRET
                generateValue: true
              - key: INGESTION_API_KEY
                generateValue: true
            disk:
              name: clickstack-data
              mountPath: /var/lib/clickhouse
              sizeGB: 10
