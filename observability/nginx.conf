worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Deliberately omit query strings, referrers, user agents, and authorization
  # data from proxy logs. The path and status are enough to operate this edge.
  log_format loyal '[$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent';
  access_log /dev/stdout loyal;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  server {
    listen 0.0.0.0:8080;
    server_name _;

    keepalive_timeout 65s;
    send_timeout 10s;

    location = /v1/logs {
      client_max_body_size 64k;

      if ($request_method != POST) {
        return 405;
      }
      if ($args != '') {
        return 404;
      }
      # nginx starts immediately so a brand-new HyperDX install can be
      # bootstrapped through the UI. Ingestion remains closed until the
      # supervisor has proved that the collector rejects missing credentials.
      if (!-f /tmp/loyal-clickstack-collector-auth-ready) {
        return 503;
      }

      proxy_pass http://127.0.0.1:4318/v1/logs;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:4318;
      proxy_set_header Connection '';
      proxy_request_buffering on;
      proxy_connect_timeout 1s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;

      # Browser callers use the same-origin frontend relay. Never turn this
      # collector endpoint into a cross-origin browser API.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
    }

    location = /v1/metrics {
      client_max_body_size 64k;

      if ($request_method != POST) {
        return 405;
      }
      if ($args != '') {
        return 404;
      }
      if (!-f /tmp/loyal-clickstack-collector-auth-ready) {
        return 503;
      }

      proxy_pass http://127.0.0.1:4318/v1/metrics;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:4318;
      proxy_set_header Connection '';
      proxy_request_buffering on;
      proxy_connect_timeout 1s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
    }

    location = /v1/traces {
      client_max_body_size 64k;

      if ($request_method != POST) {
        return 405;
      }
      if ($args != '') {
        return 404;
      }
      if (!-f /tmp/loyal-clickstack-collector-auth-ready) {
        return 503;
      }

      proxy_pass http://127.0.0.1:4318/v1/traces;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:4318;
      proxy_set_header Connection '';
      proxy_request_buffering on;
      proxy_connect_timeout 1s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
    }

    location ^~ /v1/ {
      return 404;
    }

    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      # HyperDX's validated FRONTEND_URL is the canonical external origin.
      # Do not let an arbitrary client Host header override redirect/cookie
      # behavior at the loopback application boundary.
      proxy_set_header Host 127.0.0.1:8081;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host '';
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 2s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}
