[workspace]
members = [
    "crates/loyal-cli",
    "crates/private-transfers-cli",
    "crates/smart-accounts-cli",
    "crates/loyal-smart-accounts-rs",
    "programs/telegram-private-transfer",
    "programs/telegram-verification",
