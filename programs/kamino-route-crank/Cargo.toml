[package]
name = "kamino-route-crank"
version = "0.1.0"
description = "Permissionless crank entrypoint for Kamino deposit routing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kamino_route_crank"

[features]
devnet = []
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
