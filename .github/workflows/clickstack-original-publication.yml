name: clickstack-ch-sql-shutdown-v1
on:
  workflow_dispatch:
  push:
    branches: [codex/clickstack-ch-sql-shutdown-v1]
    paths: [.github/workflows/clickstack-original-publication.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: clickstack-maintenance-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Materialize exact public hosting context
        shell: bash
        run: |
          python3 - <<'PYCONTEXT'
          import base64,hashlib,json,os,pathlib
          root=pathlib.Path('context');root.mkdir(mode=0o700)
          files=json.loads('{"Dockerfile": "", "Dockerfile.dockerignore": "KgohRG9ja2VyZmlsZQohbmdpbnguY29uZgohc2NyaXB0cy8KIXNjcmlwdHMvKioK", "nginx.conf": "", "scripts/ch-sql.cjs": "", "scripts/entry.base.sh": "", "scripts/entrypoint.sh": "", "scripts/maintenance-lifecycle.sh": "", "scripts/maintenance-state.cjs": ""}')
          pins=json.loads('{"Dockerfile": "743dd338d2d6d5b3ab2f6b7509983db16b7eb69f17b1779e1e4fa3abec939da9", "Dockerfile.dockerignore": "845888874b6ff58d6c74d2eea8ee8cd1ad895e423eb9342bd11c58e841482e1f", "nginx.conf": "8d07648f092b92f6ac405dbf7c775050552cd1901346d3e7bf4a06309c105b48", "scripts/ch-sql.cjs": "e4597e86c0758cdd9444959fe756f04416f421923c1728e1cd0b6412580a41ff", "scripts/entry.base.sh": "29460e435cdc6e48bd41ca74a96b4586ed77340363ba3f9c8be5276cbb37f240", "scripts/entrypoint.sh": "24bd86c76e7857b398b22aef0236de9d25cca207d8b9ab600126da7776a9d9d3", "scripts/maintenance-lifecycle.sh": "a3edbb4f1defed1a4a56fbffa72f5dbd5e1416e4c5611c7c0cc293250d5c836e", "scripts/maintenance-state.cjs": "700a65c90fa6a135d41361ae646fd197ab0ec2401ab30c11f2a19c72a132bc99"}')
          for name,value in files.items():
              raw=base64.b64decode(value);assert hashlib.sha256(raw).hexdigest()==pins[name]
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw);p.chmod(0o600)
          PYCONTEXT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: context
          file: context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/loyal-labs/loyal-app/clickstack:ch-sql-shutdown-v1-20f4-run-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/loyal-labs/loyal-app
            loyal.publication.revision=${{ github.sha }}
            loyal.publication.run=${{ github.run_id }}
          provenance: false
      - name: Record immutable output
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PYRECEIPT'
          import json,os,pathlib,re
          digest=os.environ['DIGEST'];assert re.fullmatch('sha256:[0-9a-f]{64}',digest)
          pathlib.Path('publication').mkdir()
          pathlib.Path('publication/clickstack-hosting-image.json').write_text(json.dumps({'status':'PASS','image':'ghcr.io/loyal-labs/loyal-app/clickstack@'+digest,'source_commit':'20f4ba444a5508569b74bc0a2ac1f25350e770d4','source_effects':False,'app_started':False,'publication_revision':os.environ['GITHUB_SHA'],'publication_run':os.environ['GITHUB_RUN_ID']}))
          PYRECEIPT
      - uses: actions/upload-artifact@v4
        with:
          name: clickstack-maintenance-${{ github.run_id }}
          path: publication/clickstack-hosting-image.json
          if-no-files-found: error
          retention-days: 30
