name: Sync Mirror Repos

on:
  workflow_run:
    workflows: ["Release Packages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync mirrors
        run: |
          if [ -z "$MIRROR_SYNC_TOKEN" ]; then
            echo "MIRROR_SYNC_TOKEN is required to push generated mirrors."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun run scripts/mirror-repos/sync.ts --skip-if-packages-unpublished
          else
            bun run scripts/mirror-repos/sync.ts --skip-if-packages-unpublished --changed-only
          fi
        env:
          MIRROR_SYNC_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
