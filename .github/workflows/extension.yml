name: Extension CI
on:
  push:
    paths: ["apps/extension/**", "packages/wallet-core/**"]
  pull_request:
    paths: ["apps/extension/**", "packages/wallet-core/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:solana-packages
      - run: cd packages/wallet-core && bun run typecheck && bun run build
      - id: version
        run: echo "v=$(jq -r .version apps/extension/package.json)" >> "$GITHUB_OUTPUT"
      - name: Write extension .env
        env:
          VITE_COINGECKO_API_KEY: ${{ secrets.VITE_COINGECKO_API_KEY }}
          VITE_MIXPANEL_TOKEN: ${{ secrets.VITE_MIXPANEL_TOKEN }}
        run: printf 'VITE_COINGECKO_API_KEY=%s\nVITE_MIXPANEL_TOKEN=%s\n' "$VITE_COINGECKO_API_KEY" "$VITE_MIXPANEL_TOKEN" > apps/extension/.env
      - run: cd apps/extension && bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: loyal-ext-universal-v${{ steps.version.outputs.v }}
          path: apps/extension/.output/chrome-mv3/
      - run: cd apps/extension && bun run build:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: loyal-ext-firefox-v${{ steps.version.outputs.v }}
          path: apps/extension/.output/firefox-mv2/
      - name: Create release
        if: github.ref == 'refs/heads/main'
        run: |
          cd apps/extension/.output
          zip -r loyal-ext-universal-v${{ steps.version.outputs.v }}.zip chrome-mv3/
          zip -r loyal-ext-firefox-v${{ steps.version.outputs.v }}.zip firefox-mv2/
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ext-v${{ steps.version.outputs.v }}
          name: Extension v${{ steps.version.outputs.v }}
          make_latest: false
          files: |
            apps/extension/.output/loyal-ext-universal-v${{ steps.version.outputs.v }}.zip
            apps/extension/.output/loyal-ext-firefox-v${{ steps.version.outputs.v }}.zip
