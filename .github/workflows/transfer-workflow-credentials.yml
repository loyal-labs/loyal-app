name: Transfer workflow credentials

# One-time consolidation handoff. Runs trusted main only; never prints values.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transfer-workflow-credentials
  cancel-in-progress: false

jobs:
  transfer:
    if: github.ref == 'refs/heads/main' && github.repository == 'loyal-labs/loyal-app'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      DESTINATION: loyal-labs/loyal-yield-routing
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      MIRROR_SYNC_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_COINGECKO_API_KEY: ${{ secrets.VITE_COINGECKO_API_KEY }}
      VITE_MIXPANEL_TOKEN: ${{ secrets.VITE_MIXPANEL_TOKEN }}
      TRUSTED_USERS: ${{ vars.TRUSTED_VERCEL_PREVIEW_USERS }}
    steps:
      - name: Validate access and source configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in NPM_TOKEN RELEASE_GITHUB_TOKEN MIRROR_SYNC_TOKEN VERCEL_TOKEN VITE_COINGECKO_API_KEY VITE_MIXPANEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing source secret: $name"
              exit 1
            fi
          done
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$TRUSTED_USERS" >/dev/null
          gh api "repos/$DESTINATION/actions/secrets/public-key" --silent
          # Refuse a repeat handoff into an already active publisher.
          variables="$(gh api "repos/$DESTINATION/actions/variables" --paginate --jq '.variables[] | select(.name | startswith("LOYAL_")) | select(.value == "true") | .name')"
          if [[ -n "$variables" ]]; then
            echo "::error::Destination has active migration switches; review before transferring again."
            exit 1
          fi

      - name: Transfer encrypted secrets and trusted-user policy
        shell: bash
        run: |
          set -euo pipefail
          for name in NPM_TOKEN RELEASE_GITHUB_TOKEN MIRROR_SYNC_TOKEN VERCEL_TOKEN VITE_COINGECKO_API_KEY VITE_MIXPANEL_TOKEN; do
            # gh encrypts stdin with the destination public key before uploading.
            printf '%s' "${!name}" | gh secret set "$name" --repo "$DESTINATION"
          done
          printf '%s' "$TRUSTED_USERS" | gh variable set TRUSTED_VERCEL_PREVIEW_USERS --repo "$DESTINATION"
          gh secret list --repo "$DESTINATION"
          echo "Credentials transferred. Publishing and previews remain disabled until their separate handoff."
