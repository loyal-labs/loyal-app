name: hetzner-relay-original-image
on:
  workflow_dispatch:
  push:
    branches:
      - codex/relay-original-a6f150-publication
    paths:
      - .github/workflows/hetzner-observability-images.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: hetzner-relay-original-a6f150
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: a6f15023325fd157c436167b6f477cd3b7565b2e
          persist-credentials: false
      - name: Apply sole hosting base pin and record inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a6f15023325fd157c436167b6f477cd3b7565b2e
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('observability/telegram-relay')
          p=root/'Dockerfile';raw=p.read_bytes()
          old=b'FROM oven/bun:1.3.11-slim AS runtime'
          new=b'FROM oven/bun:1.3.11-slim@sha256:49a1dfafe49d774e0b75a17bd596d5a8e49231c1fab76d9a30b6fc690c30f30e AS runtime'
          if raw.count(old)!=1:raise SystemExit('source mismatch')
          p.write_bytes(raw.replace(old,new))
          names=subprocess.check_output(['git','ls-files','observability/telegram-relay']).decode().splitlines()
          for name in names:
              if name==str(p):continue
              original=subprocess.check_output(['git','show','HEAD:'+name])
              if pathlib.Path(name).read_bytes()!=original:raise SystemExit('source changed')
          pathlib.Path('publication').mkdir()
          hashes={str(pathlib.Path(n).relative_to(root)):hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest() for n in names}
          pathlib.Path('publication/context.json').write_text(json.dumps({'source_revision':'a6f15023325fd157c436167b6f477cd3b7565b2e','hosting_only_delta':'Bun base digest pin','file_sha256':hashes},sort_keys=True))
          PY
          test "$(git diff --name-only)" = observability/telegram-relay/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish original relay only
        id: build
        uses: docker/build-push-action@v6
        with:
          context: observability/telegram-relay
          file: observability/telegram-relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/loyal-labs/loyal-app/telegram-relay:source-a6f15023325fd157c436167b6f477cd3b7565b2e-hostpin-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=a6f15023325fd157c436167b6f477cd3b7565b2e
            org.opencontainers.image.source=https://github.com/loyal-labs/loyal-app
          provenance: mode=max
      - name: Record immutable publication
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg digest "$DIGEST" --arg run "$GITHUB_RUN_ID" --arg workflow "$WORKFLOW_REVISION" \
            '{image:"ghcr.io/loyal-labs/loyal-app/telegram-relay",digest:$digest,reference:("ghcr.io/loyal-labs/loyal-app/telegram-relay@"+$digest),revision:"a6f15023325fd157c436167b6f477cd3b7565b2e",workflow_revision:$workflow,platform:"linux/amd64",run_id:$run,hosting_only_delta:"Bun base digest pin"}' > publication/telegram-relay.json
      - uses: actions/upload-artifact@v4
        with:
          name: hetzner-relay-original-a6f150-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication/*.json
          if-no-files-found: error
          retention-days: 30
